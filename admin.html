<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:white;
  padding:40px;
}
input,button{
  padding:12px;
  margin:6px;
  font-size:16px;
}
button{
  cursor:pointer;
  border:none;
  border-radius:6px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border:1px solid #555;
  padding:10px;
}
th{
  background:#222;
}
.delete-btn{
  background:#e53935;
  color:white;
}
.delete-btn:hover{
  background:#c62828;
}
</style>

</head>
<body>

<h1>Portfolio Admin Login</h1>

<div id="loginBox">
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="loadMessages()">Login</button>
</div>

<table id="table"></table>

<script>

let adminUser="";
let adminPass="";

async function loadMessages(){

  adminUser=document.getElementById("user").value.trim();
  adminPass=document.getElementById("pass").value;

  const res=await fetch(
    `/api/messages?user=${encodeURIComponent(adminUser)}&pass=${encodeURIComponent(adminPass)}`
  );

  if(!res.ok){
    const err=await res.json().catch(()=>({message:"Wrong username or password"}));
    alert(err.message);
    return;
  }

  const data=await res.json();

  let html=`
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Message</th>
      <th>Date</th>
      <th>Action</th>
    </tr>`;

  data.forEach(m=>{
    html+=`
      <tr>
        <td>${m.name}</td>
        <td>${m.email}</td>
        <td>${m.message}</td>
        <td>${new Date(m.created_at).toLocaleString()}</td>
        <td>
          <button class="delete-btn" onclick="deleteMessage(${m.id})">
            Delete
          </button>
        </td>
      </tr>`;
  });

  document.getElementById("loginBox").style.display="none";
  document.getElementById("table").innerHTML=html;
}

async function deleteMessage(id){

  if(!confirm("Are you sure you want to delete this message?")){
    return;
  }

  const res=await fetch(
    `/api/delete-message?id=${id}&user=${encodeURIComponent(adminUser)}&pass=${encodeURIComponent(adminPass)}`,
    {
      method:"DELETE"
    }
  );

  const result=await res.json();

  if(result.success){
    loadMessages();
  }else{
    alert(result.message);
  }
}

</script>

</body>
</html>
